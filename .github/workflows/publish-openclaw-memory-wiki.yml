name: Publish @next-wiki/openclaw-memory-wiki

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish (must match the package version)
        required: true
        type: string
  push:
    tags:
      - 'openclaw-memory-wiki-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup npm with trusted publishing support
        run: npm install --global npm@11.14.1 --registry=https://registry.npmjs.org

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          node -e 'const pkg = require("./packages/openclaw-memory-wiki/package.json"); if (process.env.RELEASE_TAG !== "openclaw-memory-wiki-v" + pkg.version) throw new Error("Release tag must match the package version");'
          npm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @next-wiki/openclaw-memory-wiki typecheck
      - run: pnpm --filter @next-wiki/openclaw-memory-wiki lint
      - run: pnpm --filter @next-wiki/openclaw-memory-wiki test
      - run: pnpm --filter @next-wiki/openclaw-memory-wiki build
      - name: Publish to npm
        working-directory: packages/openclaw-memory-wiki
        run: npm publish --provenance --access public --loglevel=verbose
