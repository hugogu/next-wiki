[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "next-wiki-hermes-memory"
version = "0.1.3"
description = "Hermes MemoryProvider backed by next-wiki's scoped memory API"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "next-wiki contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/hugogu/next-wiki"
Documentation = "https://github.com/hugogu/next-wiki/blob/main/packages/hermes-memory-provider/README.md"
Repository = "https://github.com/hugogu/next-wiki"

[project.scripts]
next-wiki-hermes-memory = "next_wiki_memory.cli:main"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8"]

[project.entry-points."hermes_agent.memory_providers"]
next-wiki = "next_wiki_memory:register"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
