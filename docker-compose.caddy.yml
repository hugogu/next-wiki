services:
  caddy:
    image: caddy:2.8.4-alpine
    container_name: next-wiki-caddy
    restart: unless-stopped
    environment:
      # Canonical next-wiki public host. APP_URL should use this origin without
      # the /wiki content-space prefix.
      CADDY_HOST: ${CADDY_HOST:-kb.example.com}
      CADDY_CANONICAL_URL: ${CADDY_CANONICAL_URL:-https://kb.example.com}
      # Legacy Wiki.js host. Its page paths are redirected to the canonical
      # host with the /wiki prefix; extend the pattern for other locales.
      CADDY_LEGACY_HOST: ${CADDY_LEGACY_HOST:-wiki.example.com}
      CADDY_WIKI_PREFIX: ${CADDY_WIKI_PREFIX:-wiki}
      CADDY_LEGACY_LANGUAGE_PATTERN: ${CADDY_LEGACY_LANGUAGE_PATTERN:-en|zh}
      CADDY_LEGACY_REDIRECT_CODE: ${CADDY_LEGACY_REDIRECT_CODE:-302}
      CADDY_CERT_PATH: ${CADDY_CERT_PATH:-/etc/caddy/certs/cert.pem}
      CADDY_KEY_PATH: ${CADDY_KEY_PATH:-/etc/caddy/certs/key.pem}
      CADDY_HTTPS_PORT: ${CADDY_HTTPS_PORT:-443}
      UPSTREAM_HOST: ${UPSTREAM_HOST:-web}
      UPSTREAM_PORT: ${UPSTREAM_PORT:-3000}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_CERTS_DIR:-./docker/caddy/certs}:/etc/caddy/certs:ro
    depends_on:
      web:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
